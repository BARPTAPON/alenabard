[bard]

backend_enabled   = off
base_url          = {host_scheme}://{host_decoded}{scheme_port}
http_engine       = Apache-Bard
http_port         = 80
https_port        = 443
node_engine       = Node-26.12.0
php_engine        =
project_enabled   = on
project_root      = {base_dir}
server_aliases    = www.{host}
terminal_codepage = 65001
tls_enabled       = on
web_root          = {base_dir}\dist
